---
layout: default
title: "Reviews"
permalink: /reviews/
position: 2
---

<div class="archive-container">
    
    <div class="reviews-header-container">
        <h1>Reviews</h1>
        
        <div class="filter-controls-group">
            <select id="sort-order" class="vault-filter-select">
                <option value="alpha-asc">Alphabetical (A-Z)</option>
                <option value="alpha-desc">Alphabetical (Z-A)</option>
                <option value="date-desc">Date Written (Newest)</option>
                <option value="date-asc">Date Written (Oldest)</option>
                <option value="release-desc">Release Date (Newest)</option>
                <option value="release-asc">Release Date (Oldest)</option>
            </select>

            <select id="filter-genre" class="vault-filter-select"><option value="">Genre</option></select>
            <select id="filter-platform" class="vault-filter-select"><option value="">Platform</option></select>
            <select id="filter-year" class="vault-filter-select"><option value="">Release Year</option></select>
            <select id="filter-verdict" class="vault-filter-select"><option value="">Verdict</option></select>

            <button type="button" id="reset-filters" class="filter-reset-btn" title="Clear all filters and search" hidden>Reset</button>
        </div>

        <div class="search-input-wrapper">
            <input type="text" id="live-search" class="vault-search-input" placeholder="Filter games, platforms, genres...">
            <button type="button" id="clear-search" class="search-clear-btn" aria-label="Clear search" title="Clear search" hidden>&times;</button>
        </div>
    </div>

    <div class="archive-grid">
        {% assign reviews = site.pages | where: "layout", "review" %} 

        {% for review in reviews %}
        {% include review-card.html review=review compact=true %}
        {% endfor %}
    </div>
</div>

<div id="paginationNav" class="pagination-container">
    <nav class="archive-pagination" aria-label="Page navigation">
        <span id="pageIndicator"></span>
    </nav>
</div>


<script src="/assets/js/pagination.js" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const searchInput = document.getElementById("live-search");
    const cards = document.querySelectorAll(".game-archive-card");
    const pageIndicator = document.getElementById("pageIndicator");
    const paginationNav = document.getElementById("paginationNav");

    const filterYear = document.getElementById("filter-year");
    const filterPlatform = document.getElementById("filter-platform");
    const filterGenre = document.getElementById("filter-genre");
    const filterVerdict = document.getElementById("filter-verdict");

    const itemsPerPage = 18;
    let currentPage = 1;
    // ── URL state sync (shareable / bookmarkable filter views) ──────────
    const VALID_SORTS = ["alpha-asc", "alpha-desc", "date-desc", "date-asc", "release-desc", "release-asc"];
    
    function syncStateToUrl() {
      if (!window.history || !window.history.replaceState) return;
      const params = new URLSearchParams();
      const sort = document.getElementById("sort-order").value;
      if (sort && sort !== "alpha-asc") params.set("sort", sort);
      if (filterYear.value) params.set("year", filterYear.value);
      if (filterPlatform.value) params.set("platform", filterPlatform.value);
      if (filterGenre.value) params.set("genre", filterGenre.value);
      if (filterVerdict.value) params.set("verdict", filterVerdict.value);
      const query = searchInput ? searchInput.value.trim() : "";
      if (query) params.set("q", query);
      if (currentPage > 1) params.set("page", String(currentPage));
      const qs = params.toString();
      window.history.replaceState(null, "", qs ? "?" + qs : window.location.pathname);
    }
    
    function applyStateFromUrl() {
      const params = new URLSearchParams(window.location.search);
      let matched = false;
      
      const sort = params.get("sort");
      if (sort && VALID_SORTS.indexOf(sort) !== -1) {
        document.getElementById("sort-order").value = sort;
        matched = true;
      }
      
      function applySelect(select, key) {
        const value = params.get(key);
        if (!value) return false;
        for (let i = 0; i < select.options.length; i++) {
            if (select.options[i].value === value) {
              select.value = value;
              return true;
            }
        }
        return false;
      }
      
      if (applySelect(filterYear, "year")) matched = true;
      if (applySelect(filterPlatform, "platform")) matched = true;
      if (applySelect(filterGenre, "genre")) matched = true;
      if (applySelect(filterVerdict, "verdict")) matched = true;
      
      const query = params.get("q");
      if (query) {
        if (searchInput) searchInput.value = query;
        matched = true;
      }
      
      const page = parseInt(params.get("page"), 10);
      if (page > 1) {
        currentPage = page;
        matched = true;
      }
      
      return matched;
    }
    

    function populateFilters() {
      const years = new Set();
      const platforms = new Set();
      const genres = new Set();
      const verdicts = new Set();

      cards.forEach(card => {
        if(card.dataset.year) years.add(card.dataset.year.trim());
        if(card.dataset.platform) platforms.add(card.dataset.platform.trim());
        
        if(card.dataset.genre) {
          card.dataset.genre.split(',').forEach(g => {
            const trimmedG = g.trim();
            if (trimmedG) genres.add(trimmedG);
          });
        }
        
        if(card.className) {
          const tag = card.querySelector('.archive-verdict-tag');
          if (tag) verdicts.add(tag.innerText.trim());
        }
      });

      Array.from(years).sort((a,b)=>b-a).forEach(y => filterYear.options.add(new Option(y, y)));
      Array.from(platforms).sort().forEach(p => filterPlatform.options.add(new Option(p, p)));
      Array.from(genres).sort().forEach(g => filterGenre.options.add(new Option(g, g)));
	  
      function toTitleCase(str) {
        return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
      }
	  
      const verdictOrder = ["Recommended", "Not Sure", "Not Recommended"];
      Array.from(verdicts).sort((a, b) => {
        let indexA = verdictOrder.indexOf(toTitleCase(a.trim()));
        let indexB = verdictOrder.indexOf(toTitleCase(b.trim()));
        if (indexA === -1) indexA = 99;
        if (indexB === -1) indexB = 99;
        return indexA - indexB;
      }).forEach(v => {
        const valueKey = v.toLowerCase().replace(/\s+/g, '-');
        filterVerdict.options.add(new Option(toTitleCase(v), valueKey));
      });
    }

    function getSeriesKeyAndNumber(card) {
      const titleEl = card.querySelector('.archive-card-title') || card;
      let cleanTitle = titleEl.innerText.toLowerCase().trim();
      cleanTitle = cleanTitle.replace(/\s*[:|-]?\s*(remastered|remake|edition|game of the year|goty)$/i, '').trim();
      const match = cleanTitle.match(/(.*?)\s*(?:(?:\b\d+\b)|(?:\b[ivxlcdm]+\b))$/i);
      if (match) {
        const base = match[1].replace(/[:|-]\s*$/, '').trim();
        const numPart = cleanTitle.replace(base, '').match(/\d+/);
        const num = numPart ? parseInt(numPart[0], 10) : 2; 
        return { base: base, num: num };
      }
      return { base: cleanTitle, num: 1 };
    }

    populateFilters();

    function sortDOMCards() {
      const parentContainer = document.querySelector(".archive-grid");
      const currentCards = document.querySelectorAll(".game-archive-card");
      if (currentCards.length === 0) return;

      const sortBy = document.getElementById("sort-order").value;

      const sortedCardsArray = Array.from(currentCards).sort((a, b) => {
        if (sortBy === "date-desc" || sortBy === "date-asc") {
          const dateA = new Date(a.dataset.date || "2000-01-01");
          const dateB = new Date(b.dataset.date || "2000-01-01");
          return sortBy === "date-desc" ? dateB - dateA : dateA - dateB;
        } 
        
        if (sortBy === "release-desc" || sortBy === "release-asc") {
          const yearA = parseInt(a.dataset.year, 10) || 0;
          const yearB = parseInt(b.dataset.year, 10) || 0;
          return sortBy === "release-desc" ? yearB - yearA : yearA - yearB;
        }

        if (sortBy === "alpha-asc" || sortBy === "alpha-desc") {
          const itemA = getSeriesKeyAndNumber(a);
          const itemB = getSeriesKeyAndNumber(b);
          
          if (itemA.base < itemB.base) return sortBy === "alpha-asc" ? -1 : 1;
          if (itemA.base > itemB.base) return sortBy === "alpha-asc" ? 1 : -1;
          
          return sortBy === "alpha-asc" ? itemA.num - itemB.num : itemB.num - itemA.num;
        }
        return 0;
      });

      sortedCardsArray.forEach(card => parentContainer.appendChild(card));
    }
    
    document.getElementById("sort-order").addEventListener("change", () => {
      currentPage = 1;
      sortDOMCards();
      updatePagination();
      syncStateToUrl();
      updateResetVisibility();
    });

    function updatePagination() {
      const sortedCards = document.querySelectorAll(".game-archive-card");
      const query = searchInput ? searchInput.value.toLowerCase().trim() : "";
      const selYear = filterYear.value;
      const selPlatform = filterPlatform.value;
      const selGenre = filterGenre.value;
      const selVerdict = filterVerdict.value;
      
      const filteredCards = Array.from(sortedCards).filter(card => {
        const matchesSearch = card.innerText.toLowerCase().includes(query);
        const matchesYear = !selYear || card.dataset.year === selYear;
        const matchesPlatform = !selPlatform || card.dataset.platform === selPlatform;
        
        const cardGenre = card.dataset.genre || "";
        const matchesGenre = !selGenre || cardGenre.includes(selGenre);
        const matchesVerdict = !selVerdict || card.dataset.verdict === selVerdict;
      
        return matchesSearch && matchesYear && matchesPlatform && matchesGenre && matchesVerdict;
      });
      
      const currentUrls = filteredCards.map(card => {
        try { return new URL(card.href).pathname; } catch(e) { return card.getAttribute('href'); }
      });
      localStorage.setItem('custom_review_order', JSON.stringify(currentUrls));
      
      const totalPages = Math.ceil(filteredCards.length / itemsPerPage);
      // A shared/bookmarked URL can point past the last page - clamp back into range
      if (currentPage > totalPages) currentPage = Math.max(totalPages, 1);
      sortedCards.forEach(card => card.style.setProperty("display", "none", "important"));
      
      if (filteredCards.length === 0 || totalPages <= 1) {
        if (paginationNav) paginationNav.style.setProperty("display", "none", "important");
        filteredCards.forEach(card => card.style.setProperty("display", "", "important"));
        return;
      }
      
      if (paginationNav) {
        paginationNav.style.setProperty("display", "flex", "important");
      }
      
      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      filteredCards.slice(start, end).forEach(card => {
        card.style.setProperty("display", "", "important");
      });
      
      if (pageIndicator) {
        window.setupPaginationNav({
          container: pageIndicator,
          totalPages: totalPages,
          currentPage: currentPage,
          activeColor: "#252e36",
          onPageChange: (targetPage) => {
            currentPage = targetPage;
            localStorage.setItem('reviews_current_page', currentPage);
            updatePagination();
            window.scrollTo(0, 0);
            syncStateToUrl();
          }
        });
      }
    }

    [filterYear, filterPlatform, filterGenre, filterVerdict].forEach(select => {
      select.addEventListener("change", () => {
        currentPage = 1;
        localStorage.removeItem('reviews_current_page'); 
        updatePagination();
        syncStateToUrl();
        updateResetVisibility();
      });
    });
    
    if (searchInput) {
      searchInput.addEventListener("input", function () {
        currentPage = 1;
        localStorage.removeItem('reviews_current_page'); 
        updatePagination();
        syncStateToUrl();
        updateResetVisibility();
      });
    }

    // Reset is only relevant when something is actually set; shown/hidden
    // as sort, filters or search change.
    function updateResetVisibility() {
      const hasSort = document.getElementById("sort-order").value !== "alpha-asc";
      const hasFilters = filterYear.value !== "" || filterPlatform.value !== "" ||
        filterGenre.value !== "" || filterVerdict.value !== "";
      const hasSearch = searchInput ? searchInput.value.trim() !== "" : false;
      if (resetFiltersBtn) resetFiltersBtn.hidden = !(hasSort || hasFilters || hasSearch);
      if (clearSearchBtn) clearSearchBtn.hidden = !hasSearch;
    }

    const resetFiltersBtn = document.getElementById("reset-filters");
    const clearSearchBtn = document.getElementById("clear-search");
    if (resetFiltersBtn) {
      resetFiltersBtn.addEventListener("click", function () {
        document.getElementById("sort-order").value = "alpha-asc";
        filterYear.value = "";
        filterPlatform.value = "";
        filterGenre.value = "";
        filterVerdict.value = "";
        if (searchInput) searchInput.value = "";
        currentPage = 1;
        localStorage.removeItem('reviews_current_page');
        sortDOMCards();
        updatePagination();
        syncStateToUrl();
        updateResetVisibility();
      });
    }

    if (clearSearchBtn) {
      clearSearchBtn.addEventListener("click", function () {
        if (searchInput) searchInput.value = "";
        currentPage = 1;
        localStorage.removeItem('reviews_current_page');
        updatePagination();
        syncStateToUrl();
        updateResetVisibility();
        if (searchInput) searchInput.focus();
      });
    }

    const hasUrlState = applyStateFromUrl();
    if (!hasUrlState) {
      const savedPage = localStorage.getItem('reviews_current_page');
      if (savedPage) {
        currentPage = parseInt(savedPage, 10) || 1;
      }
    }

    sortDOMCards();
    updatePagination();
    syncStateToUrl();
    updateResetVisibility();
  });
</script>
