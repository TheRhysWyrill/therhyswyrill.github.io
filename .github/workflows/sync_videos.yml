name: Update Video Vault Database

on:
  # Allows you to manually trigger the sync from the GitHub Actions tab anytime
  workflow_dispatch:
  
  # Automatically runs once a week (Every Sunday at midnight) to grab new uploads
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-vault:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out your website repository files
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up the pre-installed Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python: '3.x'

    # 3. Install yt-dlp inside the GitHub Runner container
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp

    # 4. Execute the script to generate the JSON file
    - name: Fetch Latest Videos
      run: python fetch_videos.py

    # 5. Automatically commit the changes back to your repository if anything changed
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add assets/data/all_videos.json
        if git diff --staged --quiet; then
          echo "No new video data found. Skipping commit."
        else
          git commit -m "chore: auto-update video vault archive database [skip ci]"
          git push
        fi