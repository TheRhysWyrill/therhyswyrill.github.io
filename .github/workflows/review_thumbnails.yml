name: Generate Review Cover Thumbnails

# The archive's cards offer a 560px thumbnail next to the full cover through
# srcset (see _includes/review-thumb.html and make_review_thumbs.mjs), which
# takes the cover art on page 1 of the archive from ~1.3 MB to ~390 KB — an
# average of 19 KB a card instead of 66 KB.
#
# Those thumbnails are generated files, but GitHub Pages runs Jekyll and
# nothing else — nothing in the build can resize an image — so this job does it
# on the runner and commits the result. Adding a cover to assets/img/reviews/
# is therefore all a review ever needs; the thumbnail appears on its own.
#
# It regenerates every thumbnail every time on purpose. The generator's own
# staleness check compares mtimes, and on a fresh checkout every file carries
# the same mtime, so mtime cannot distinguish a new cover from an old one.
# Re-encoding is byte-for-byte reproducible, so covers that did not change
# produce no diff and the job exits without committing — measured locally,
# re-encoding all 480 covers took 14s and staged nothing.
#
# Deleting a cover leaves its thumbnail behind; nothing here prunes orphans.
# They are unreferenced and cost only disk, but they only go away by hand.

on:
  push:
    branches: [master]
    # Only covers themselves. Committing thumbnails touches
    # assets/img/reviews/thumbs/**, which this filter does not match, so the
    # job cannot trigger itself.
    paths:
      - 'assets/img/reviews/*.webp'
      # Changing the generator changes the output of every cover, so it is a
      # trigger too.
      - 'make_review_thumbs.mjs'
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: a second push while this is mid-flight would race the
# push below.
concurrency:
  group: review-thumbnails
  cancel-in-progress: false

jobs:
  thumbnails:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out your website repository files
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Node for the generator (sharp needs 18+; 22 is the current LTS)
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # 3. The generator needs sharp and nothing else. A plain `npm install`
    #    here reconciles the whole package.json instead: 286 packages, 163 MB
    #    and ~30s of jest, Playwright and TypeScript — a lot of machinery for
    #    one image library. There is also no package-lock.json to `npm ci`
    #    from, because .gitignore excludes it.
    #    So install sharp alone into a scratch prefix and hand that tree to the
    #    script, which resolves it from the repository root as usual.
    #
    #    The version is pinned on purpose: it is the one that produced the
    #    thumbnails already in the repository. Re-encoding is byte-for-byte
    #    reproducible with a given encoder, so the pin is what stops the job
    #    rewriting all 480 covers the first time it runs with something newer.
    - name: Install Image Dependency
      run: |
        npm install --no-save --no-audit --no-fund \
          --prefix "$RUNNER_TEMP/thumbnails" sharp@0.33.5
        mv "$RUNNER_TEMP/thumbnails/node_modules" node_modules

    # 4. Write a 560px thumbnail for every cover; unchanged covers rewrite to
    #    identical bytes, so this is a no-op where nothing has changed.
    - name: Generate Thumbnails
      run: node make_review_thumbs.mjs --force

    # 5. Commit the thumbnails back to the repository. No `[skip ci]` here,
    #    unlike the data-sync jobs: these are static files that only reach the
    #    published site by way of the Pages build this push triggers.
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add assets/img/reviews/thumbs
        if git diff --staged --quiet; then
          echo "Every review cover already has a current thumbnail. Skipping commit."
        else
          git commit -m "chore: generate review cover thumbnails"
          git push
        fi
