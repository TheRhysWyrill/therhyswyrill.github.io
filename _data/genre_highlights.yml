# Optional hand-picks for a genre page's "Start here" block.
#
# genres/*.html are generated by generate_genre_pages.py — do not edit them
# directly. If a genre's three starters should be chosen rather than just
# being the three most recent reviews, list up to three review slugs here (the
# filename stem under reviews/, e.g. reviews/home.md -> "home") and the page
# will use them, labelled "hand-picked" instead of "the three most recent".
#
# Genres with no entry here fall back to the automatic pick, so this file can
# stay as short as you like.
#
# Example:
#
# Horror:
#   - home
#   - the-sinking-city
#   - cosmic-fear
#
# Puzzle:
#   - baba-is-you